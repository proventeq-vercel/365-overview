<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M365 Storage Overview</title>
    <style>
      html, body { margin: 0; background: #f9fafb; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; background: #f9fafb; font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
      .boot * { box-sizing: border-box; }
      .boot-header { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid #dedede; }
      .boot-header__bar { max-width: 1400px; height: 3.5rem; margin: 0 auto; padding: 0 1rem; display: flex; align-items: center; gap: .75rem; }
      .boot-logo { width: 10.8rem; height: 2rem; background: #0f2c3d; -webkit-mask: url(/proventeq-logo.svg) no-repeat center / contain; mask: url(/proventeq-logo.svg) no-repeat center / contain; }
      .boot-divider { display: none; width: 1px; height: 1.5rem; background: #dedede; }
      .boot-main { position: relative; width: 100%; max-width: 1400px; margin: 0 auto; padding: 1.5rem 1rem; }
      .boot-stack { display: flex; flex-direction: column; gap: 1.5rem; }
      .boot-sk { border-radius: 6px; background: #f0f0f0; animation: boot-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
      .boot-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
      .boot-panel { min-width: 0; display: flex; flex-direction: column; gap: .5rem; padding: 1rem; background: #fff; border: 1px solid #dedede; border-radius: 8px; }
      .boot-kpi { padding: 1rem 1.25rem; background: #fff; border: 1px solid #dedede; border-left-width: 3px; border-radius: 8px; }
      .boot-overlay { position: absolute; inset: 0; z-index: 10; background: rgba(249, 250, 251, .75); }
      .boot-overlay__pos { position: sticky; top: 3.5rem; height: calc(100vh - 3.5rem); display: flex; align-items: center; justify-content: center; padding: 0 1rem 18vh; }
      .boot-card { width: 100%; max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: .75rem; padding: 1.5rem; text-align: center; background: #fff; border: 1px solid #dedede; border-top: 3px solid #34a1a0; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .08); }
      .boot-card p { margin: 0; }
      .boot-badge { display: inline-flex; align-items: center; gap: .25rem; padding: .125rem .75rem; border: 1px solid rgba(52, 161, 160, .25); border-radius: 9999px; background: rgba(52, 161, 160, .08); color: #34a1a0; font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
      .boot-badge::before { content: ''; width: .375rem; height: .375rem; border-radius: 50%; background: #34a1a0; }
      .boot-ring { transform-origin: center; transform-box: fill-box; animation: boot-spin 1s linear infinite; }
      .boot-card__title { color: #0f2c3d; font-size: 1.125rem; font-weight: 700; }
      .boot-card__subtitle { color: #34a1a0; font-size: .875rem; }
      .boot-card__footer { color: #a6a6a6; font-size: .875rem; }
      .boot-steps { width: 100%; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .25rem; }
      .boot-steps li { display: flex; align-items: center; gap: .5rem; padding: .25rem .75rem; border-radius: 2px; font-size: .875rem; text-align: left; color: #a6a6a6; }
      .boot-steps li::before { content: ''; flex-shrink: 0; width: .875rem; height: .875rem; border-radius: 50%; border: 2px solid #dedede; }
      .boot-steps li[data-state='active'] { background: rgba(52, 161, 160, .06); color: #434343; }
      .boot-steps li[data-state='active']::before { border-width: 1.5px; border-top-color: #34a1a0; animation: boot-spin 1s linear infinite; }
      .boot-dots { display: flex; gap: .25rem; }
      .boot-dots span { width: .375rem; height: .375rem; border-radius: 50%; background: #a6a6a6; animation: boot-dot 1.2s ease-in-out infinite; }
      .boot-dots span:nth-child(2) { animation-delay: .2s; }
      .boot-dots span:nth-child(3) { animation-delay: .4s; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 50% { opacity: .5; } }
      @keyframes boot-dot { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }
      @media (min-width: 640px) {
        .boot-header__bar, .boot-main { padding-left: 1.5rem; padding-right: 1.5rem; }
        .boot-divider { display: block; }
        .boot-grid--kpi { grid-template-columns: repeat(2, 1fr); }
      }
      @media (min-width: 1024px) { .boot-grid--pair { grid-template-columns: repeat(2, 1fr); } .boot-grid--wide { grid-template-columns: 7fr 5fr; } }
      @media (min-width: 1280px) { .boot-grid--kpi { grid-template-columns: repeat(4, 1fr); } }
      @media (prefers-reduced-motion: reduce) { .boot * , .boot *::before { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <header class="boot-header">
          <div class="boot-header__bar">
            <div class="boot-logo" role="img" aria-label="Proventeq 365"></div>
            <span class="boot-divider" aria-hidden="true"></span>
            <div class="boot-sk" style="width: 8rem; height: 1rem"></div>
          </div>
        </header>
        <main class="boot-main">
          <div class="boot-stack" aria-busy="true" aria-label="Loading report">
            <div class="boot-stack" style="gap: .5rem">
              <div class="boot-sk" style="width: 14rem; height: 1.25rem"></div>
              <div class="boot-sk" style="max-width: 42rem; height: .875rem"></div>
            </div>
            <div class="boot-stack" style="gap: .5rem">
              <div class="boot-sk" style="width: 8rem; height: .875rem"></div>
              <div class="boot-grid boot-grid--kpi">
                <div class="boot-kpi"><div class="boot-sk" style="width: 7rem; height: 2rem"></div><div class="boot-sk" style="width: 6rem; height: .875rem; margin-top: .5rem"></div><div class="boot-sk" style="width: 10rem; height: .75rem; margin-top: .5rem"></div></div>
                <div class="boot-kpi"><div class="boot-sk" style="width: 7rem; height: 2rem"></div><div class="boot-sk" style="width: 6rem; height: .875rem; margin-top: .5rem"></div><div class="boot-sk" style="width: 10rem; height: .75rem; margin-top: .5rem"></div></div>
                <div class="boot-kpi"><div class="boot-sk" style="width: 7rem; height: 2rem"></div><div class="boot-sk" style="width: 6rem; height: .875rem; margin-top: .5rem"></div><div class="boot-sk" style="width: 10rem; height: .75rem; margin-top: .5rem"></div></div>
                <div class="boot-kpi"><div class="boot-sk" style="width: 7rem; height: 2rem"></div><div class="boot-sk" style="width: 6rem; height: .875rem; margin-top: .5rem"></div><div class="boot-sk" style="width: 10rem; height: .75rem; margin-top: .5rem"></div></div>
              </div>
            </div>
            <div class="boot-grid boot-grid--pair">
              <div class="boot-panel"><div class="boot-sk" style="width: 33%; height: .875rem"></div><div class="boot-sk" style="width: 67%; height: .75rem"></div><div class="boot-sk" style="height: 13rem; margin-top: .5rem"></div></div>
              <div class="boot-panel"><div class="boot-sk" style="width: 33%; height: .875rem"></div><div class="boot-sk" style="width: 67%; height: .75rem"></div><div class="boot-sk" style="height: 13rem; margin-top: .5rem"></div></div>
            </div>
            <div class="boot-grid boot-grid--wide">
              <div class="boot-panel"><div class="boot-sk" style="width: 33%; height: .875rem"></div><div class="boot-sk" style="width: 67%; height: .75rem"></div><div class="boot-sk" style="height: 16rem; margin-top: .5rem"></div></div>
              <div class="boot-panel"><div class="boot-sk" style="width: 33%; height: .875rem"></div><div class="boot-sk" style="width: 67%; height: .75rem"></div><div class="boot-sk" style="height: 16rem; margin-top: .5rem"></div></div>
            </div>
            <div class="boot-panel"><div class="boot-sk" style="width: 33%; height: .875rem"></div><div class="boot-sk" style="width: 67%; height: .75rem"></div><div class="boot-sk" style="height: 18rem; margin-top: .5rem"></div></div>
          </div>
          <div class="boot-overlay">
            <div class="boot-overlay__pos">
              <div class="boot-card" role="status" aria-live="polite">
                <span class="boot-badge">Starting</span>
                <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
                  <circle cx="32" cy="32" r="24" fill="none" stroke="#dedede" stroke-width="4.5" />
                  <circle class="boot-ring" cx="32" cy="32" r="24" fill="none" stroke="#34a1a0" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="37.7 113.1" />
                  <circle cx="32" cy="32" r="5.5" fill="#34a1a0" />
                </svg>
                <p class="boot-card__title">Getting your report ready</p>
                <p class="boot-card__subtitle">Preparing a secure Microsoft 365 sign-in.</p>
                <ul class="boot-steps">
                  <li data-state="active">Prepare sign-in</li>
                  <li data-state="pending">Sign in to Microsoft 365</li>
                  <li data-state="pending">Read SharePoint and OneDrive usage</li>
                </ul>
                <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                <p class="boot-card__footer">Your storage report will appear shortly</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
