<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M365 Storage Overview</title>
    <style>
      html, body { margin: 0; background: #f9fafb; }
      .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; background: #f9fafb; font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .auth-screen__card { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
      .auth-screen__card::before { content: ''; width: 11rem; height: 2.1rem; background: #0f2c3d; -webkit-mask: url(/proventeq-logo.svg) no-repeat center / contain; mask: url(/proventeq-logo.svg) no-repeat center / contain; }
      .auth-screen__title { margin: 0; color: #808080; font-size: .875rem; }
      .auth-screen__spinner { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 4px solid #dedede; border-top-color: #34a1a0; animation: auth-spin .8s linear infinite; }
      @keyframes auth-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .auth-screen__spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="auth-screen" role="status" aria-live="polite">
        <div class="auth-screen__card">
          <div class="auth-screen__spinner" aria-hidden="true"></div>
          <p class="auth-screen__title">Loading…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
