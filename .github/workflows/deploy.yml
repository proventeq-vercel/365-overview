name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FUNCTION_APP: func-lh-sa-dev
  DELEGATED_CLIENT_ID: 0cedd025-e545-44f2-b3f8-82969e56547a
  STORAGE_ACCOUNT: p365lite

jobs:
  credentials:
    name: are the Azure credentials configured
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      site-ready: ${{ steps.check.outputs.site-ready }}
      application-site-ready: ${{ steps.check.outputs.application-site-ready }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          STORAGE_SAS: ${{ secrets.AZURE_STORAGE_SAS }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No AZURE_* secrets: skipping the proxy deploy. See README, "Automatic deployment".' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SWA_TOKEN" ]; then
            echo 'site-ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'site-ready=false' >> "$GITHUB_OUTPUT"
            echo 'No AZURE_STATIC_WEB_APPS_API_TOKEN secret: skipping the main (delegated) site deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$STORAGE_SAS" ]; then
            echo 'application-site-ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'application-site-ready=false' >> "$GITHUB_OUTPUT"
            echo 'No AZURE_STORAGE_SAS secret: skipping the application-permissions site deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi

  proxy:
    name: graph proxy → Azure Functions
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME || env.FUNCTION_APP }}
          package: functions
          sku: flexconsumption
          remote-build: false

  site:
    name: SPA, delegated permissions (main) → Azure Static Web App
    needs: credentials
    if: needs.credentials.outputs.site-ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CLIENT_ID: ${{ vars.VITE_DELEGATED_CLIENT_ID || env.DELEGATED_CLIENT_ID }}
          VITE_FEATURES: ${{ vars.VITE_FEATURES }}
          VITE_MODES_LOCKED: ${{ vars.VITE_MODES_LOCKED }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

  site-application:
    name: SPA, application permissions → Azure Storage static website
    needs: credentials
    if: needs.credentials.outputs.application-site-ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GRAPH_PROXY_URL: ${{ vars.VITE_GRAPH_PROXY_URL }}
          VITE_GRAPH_PROXY_SCOPE: ${{ vars.VITE_GRAPH_PROXY_SCOPE }}
          VITE_FEATURES: ${{ vars.VITE_FEATURES }}
          VITE_MODES_LOCKED: ${{ vars.VITE_MODES_LOCKED }}
      - name: upload to the static website
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || env.STORAGE_ACCOUNT }}
          SAS: ${{ secrets.AZURE_STORAGE_SAS }}
        run: |
          az storage blob upload-batch --account-name "$ACCOUNT" --sas-token "$SAS" \
            --destination '$web' --source dist --overwrite --only-show-errors
          az storage blob upload-batch --account-name "$ACCOUNT" --sas-token "$SAS" \
            --destination '$web' --source dist --pattern '*.md' \
            --content-type 'text/markdown; charset=utf-8' --overwrite --only-show-errors
          az storage blob upload-batch --account-name "$ACCOUNT" --sas-token "$SAS" \
            --destination '$web' --source dist --pattern '*.txt' \
            --content-type 'text/plain; charset=utf-8' --overwrite --only-show-errors
          az storage blob upload --account-name "$ACCOUNT" --sas-token "$SAS" \
            --container-name '$web' --name index.html --file dist/index.html --overwrite \
            --content-type 'text/html' --content-cache-control 'no-cache' --only-show-errors
