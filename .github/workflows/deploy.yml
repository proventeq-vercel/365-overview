name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FUNCTION_APP: func-lh-sa-dev

jobs:
  credentials:
    name: are the Azure credentials configured
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      site-ready: ${{ steps.check.outputs.site-ready }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No AZURE_* secrets: skipping the proxy deploy. See README, "Automatic deployment".' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SWA_TOKEN" ]; then
            echo 'site-ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'site-ready=false' >> "$GITHUB_OUTPUT"
            echo 'No AZURE_STATIC_WEB_APPS_API_TOKEN secret: skipping the site deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi

  proxy:
    name: graph proxy → Azure Functions
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME || env.FUNCTION_APP }}
          package: functions
          sku: flexconsumption
          remote-build: false

  site:
    name: SPA → Azure Static Web App
    needs: credentials
    if: needs.credentials.outputs.site-ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GRAPH_PROXY_URL: ${{ vars.VITE_GRAPH_PROXY_URL }}
          VITE_GRAPH_PROXY_SCOPE: ${{ vars.VITE_GRAPH_PROXY_SCOPE }}
          VITE_FEATURES: ${{ vars.VITE_FEATURES }}
          VITE_MODES_LOCKED: ${{ vars.VITE_MODES_LOCKED }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
